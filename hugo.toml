baseURL = "https://josokw.github.io/appartement-nieuws/"
languageCode = "nl"
defaultContentLanguage = "nl"
title = "Appartement Nieuws"
theme = "github.com/adityatelange/hugo-PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pagination.pagerSize = 10

[module]
[[module.imports]]
path = "github.com/adityatelange/hugo-PaperMod"

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
description = "Nieuws en mededelingen voor de bewoners van het appartementencomplex."
DateFormat = "2 januari 2006"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowWordCount = false
ShowToc = false
ShowFullTextinRSS = true

[params.homeInfoParams]
Title = "Appartement Nieuws"
Content = "Nieuws en mededelingen voor de bewoners van ons appartementencomplex."

[params.cover]
responsiveImages = true
linkFullImages = true
hidden = false
hiddenInList = false
hiddenInSingle = false

[params.assets]
disableHLJS = true
disableFingerprinting = false

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]

[markup.goldmark.renderer]
unsafe = false

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2
